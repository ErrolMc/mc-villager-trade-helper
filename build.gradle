plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'villager-trade-helper'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup 'me.shedaniel.cloth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villager-trade-helper" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game tests in src/gametest: `gradlew runClientGameTest` starts a real client, trades with villagers through the real screen.
	configureTests {
		createSourceSet = true
		modId = 'villager-trade-helper-gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Config screen (optional at runtime: only used when Mod Menu and Cloth Config are both installed)
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}
	localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: 'net.fabricmc.fabric-api'
	}

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	// Compile and run with JDK 25 no matter which JDK Gradle itself was started with.
	// IntelliJ also uses this toolchain as the module SDK.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
